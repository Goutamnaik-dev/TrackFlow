
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrackFlow | Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f6fb;
            font-family: system-ui, sans-serif;
        }

        .register-card {
            width: 100%;
            max-width: 430px;
            padding: 35px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0,0,0,.08);
        }

        .brand {
            color: #3157d5;
            font-size: 28px;
            font-weight: 800;
        }
    </style>
</head>

<body>

<div class="register-card">

    <div class="text-center mb-4">
        <div class="brand">TrackFlow</div>
        <p class="text-secondary mt-2">Start organizing your career.</p>
    </div>

    <h4 class="fw-bold mb-1">Create an account</h4>
    <p class="text-secondary mb-4">Register to get started.</p>

    <form id="register-form">

        <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-control"
                    placeholder="demo@gmail.com"
                    required
                    maxlength="190"
                    pattern="[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}"
                    title="Enter a valid email address, e.g. demo@gmail.com"
            >
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" class="form-control"
                   placeholder="Create a password" minlength="8" required>
        </div>

        <div class="mb-3">
            <label for="confirm-password" class="form-label">
                Confirm password
            </label>
            <input type="password" id="confirm-password"
                   class="form-control"
                   placeholder="Enter password again" required>
        </div>

        <p id="register-message" class="small" role="alert"></p>

        <button type="submit" id="register-button"
                class="btn btn-primary w-100 py-2">
            Create Account
        </button>

    </form>

    <p class="text-center mt-4 mb-0">
        Already have an account?
        <a href="/login.html">Login</a>
    </p>

</div>

<script>
    function getCookie(name) {
        const cookie = document.cookie
            .split("; ")
            .find(row => row.startsWith(name + "="));

        return cookie
            ? decodeURIComponent(cookie.split("=")[1])
            : null;
    }

    document.getElementById("register-form")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword =
                document.getElementById("confirm-password").value;

            const message = document.getElementById("register-message");
            const button = document.getElementById("register-button");

            message.className = "small text-danger";
            message.textContent = "";

            if (password !== confirmPassword) {
                message.textContent = "Passwords do not match.";
                return;
            }

            button.disabled = true;
            button.textContent = "Creating account...";

            try {
                const csrfResponse = await fetch("/api/auth/csrf", {
                    credentials: "same-origin"
                });

                if (!csrfResponse.ok) {
                    throw new Error("Could not initialize security token.");
                }

                const csrfToken = getCookie("XSRF-TOKEN");

                if (!csrfToken) {
                    throw new Error("Security token not found. Refresh the page.");
                }

                const response = await fetch("/api/auth/register", {
                    method: "POST",
                    credentials: "same-origin",
                    headers: {
                        "Content-Type": "application/json",
                        "X-XSRF-TOKEN": csrfToken
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                const result = await response.text();

                if (!response.ok) {
                    throw new Error(result || "Registration failed.");
                }

                message.className = "small text-success";
                message.textContent = "Account created successfully! Redirecting...";

                setTimeout(() => {
                    window.location.replace("/login.html");
                }, 1000);

            } catch (error) {
                message.textContent = error.message;
                button.disabled = false;
                button.textContent = "Create Account";
            }
        });
</script>

</body>
</html>
