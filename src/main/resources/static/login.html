
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrackFlow | Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f6fb;
            font-family: system-ui, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 35px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0,0,0,.08);
        }

        .brand {
            color: #3157d5;
            font-size: 28px;
            font-weight: 800;
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="text-center mb-4">
        <div class="brand">TrackFlow</div>
        <p class="text-secondary mt-2">
            Organize your next opportunity.
        </p>
    </div>

    <h4 class="fw-bold mb-1">Welcome back!</h4>
    <p class="text-secondary mb-4">Login to your account.</p>

    <form id="login-form">

        <div class="mb-3">
            <label for="email" class="form-label">Email address</label>

            <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-control"
                    placeholder="demo@gmail.com"
                    required
                    maxlength="190"
                    pattern="[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}"
                    title="Enter a valid email address, e.g. demo@gmail.com"
            >
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password"
                   id="password"
                   class="form-control"
                   placeholder="Enter your password"
                   required>
        </div>

        <p id="login-error" class="text-danger small"></p>

        <button type="submit"
                id="login-button"
                class="btn btn-primary w-100 py-2">
            Login
        </button>

    </form>

    <p class="text-center mt-4 mb-0">
        Don't have an account?
        <a href="/register.html">Create account</a>
    </p>

</div>

<script>
    // Read a cookie by name
    function getCookie(name) {
        const cookie = document.cookie
            .split("; ")
            .find(row => row.startsWith(name + "="));

        return cookie
            ? decodeURIComponent(cookie.split("=")[1])
            : null;
    }

    // Login form submission
    document.getElementById("login-form")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const errorElement = document.getElementById("login-error");
            const button = document.getElementById("login-button");

            errorElement.textContent = "";
            button.disabled = true;
            button.textContent = "Logging in...";

            try {
                // First obtain a CSRF token
                const csrfResponse = await fetch("/api/auth/csrf", {
                    credentials: "same-origin"
                });

                if (!csrfResponse.ok) {
                    throw new Error("Could not initialize security token.");
                }

                const csrfToken = getCookie("XSRF-TOKEN");

                if (!csrfToken) {
                    throw new Error("Security token not found. Refresh the page.");
                }

                // Send login request
                const response = await fetch("/api/auth/login", {
                    method: "POST",
                    credentials: "same-origin",
                    headers: {
                        "Content-Type": "application/json",
                        "X-XSRF-TOKEN": csrfToken
                    },
                    body: JSON.stringify({
                        email: document.getElementById("email").value.trim(),
                        password: document.getElementById("password").value
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.message || "Login failed.");
                }

                // Login successful: open dashboard
                window.location.replace("/");

            } catch (error) {
                errorElement.textContent = error.message;
                button.disabled = false;
                button.textContent = "Login";
            }
        });
</script>

</body>
</html>
